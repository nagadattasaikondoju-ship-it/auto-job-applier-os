# Render Blueprint for the Applyon backend.
# Render dashboard → New → Blueprint → pick this repo. Render creates everything below and asks
# for the values marked `sync: false` (Gemini key, Adzuna keys, Firebase service account).
#
# The website stays on Vercel; set NEXT_PUBLIC_API_BASE_URL there to the applyon-api URL.

databases:
  - name: applyon-db
    plan: free # free Postgres expires after 30 days; switch to basic-256mb to keep data
    databaseName: applyon
    user: applyon
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: applyon-redis
    plan: free
    ipAllowList: [] # only services in this account can connect
    maxmemoryPolicy: noeviction # Celery queues must not be evicted

  # REST API. Runs migrations and loads the company list on every start (both are idempotent).
  - type: web
    name: applyon-api
    runtime: docker
    plan: free
    dockerfilePath: ./infra/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    # Start-up is infra/start.sh (the image's default command): migrations, company list, the
    # background worker (job search, matching, auto-apply, browser submissions) and the API, all in
    # this one free service. Free services sleep after 15 idle minutes, so scheduled work pauses
    # until the next visit. For always-on work, uncomment applyon-worker below (Starter, ~$7/month)
    # and set RUN_WORKER_IN_API=false here.
    envVars: &backendEnv
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: applyon-db, property: connectionString }
      - key: DIRECT_DATABASE_URL
        fromDatabase: { name: applyon-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: applyon-redis, property: connectionString }
      - key: FRONTEND_URL
        value: https://applyon-rho.vercel.app
      - key: CORS_ORIGINS
        value: '["https://applyon-rho.vercel.app","http://localhost:3000"]'
      # "true" lets the preview be tried with "Continue as dev user" before Firebase is set up,
      # but then anyone can sign in as anyone and read their data. Keep it "false" for real users.
      - key: ALLOW_DEV_LOGIN
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: JSEARCH_API_KEY
        sync: false
      - key: REALTIME_JOBS_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true

