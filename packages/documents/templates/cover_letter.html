<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ profile.full_name }} - Cover Letter</title>
    <style>
        @page {
            size: A4;
            margin: 0.8in;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #111827;
            line-height: 1.6;
            font-size: 11pt;
            margin: 0;
            padding: 0;
        }
        .header {
            margin-bottom: 24px;
        }
        .name {
            font-size: 18pt;
            font-weight: 700;
            text-transform: uppercase;
            margin: 0 0 4px 0;
        }
        .contact {
            font-size: 9.5pt;
            color: #4b5563;
        }
        .date {
            margin: 20px 0 16px 0;
            font-size: 10pt;
            color: #374151;
        }
        .recipient {
            margin-bottom: 20px;
            font-size: 10pt;
            color: #1f2937;
        }
        .body-text {
            white-space: pre-line;
            font-size: 10.5pt;
            color: #1f2937;
            text-align: justify;
        }
        .signoff {
            margin-top: 24px;
            font-size: 10.5pt;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="name">{{ profile.full_name }}</h1>
        <div class="contact">
            {{ profile.email }} | {{ profile.phone }} | {{ profile.city }}{% if profile.country %}, {{ profile.country }}{% endif %}
        </div>
    </div>

    <div class="date">{{ date_str }}</div>

    <div class="recipient">
        <strong>Hiring Team</strong><br>
        {{ company_name }}
    </div>

    <div class="body-text">
        {{ cover_letter_body }}
    </div>

    <div class="signoff">
        Sincerely,<br><br>
        <strong>{{ profile.full_name }}</strong>
    </div>
</body>
</html>
