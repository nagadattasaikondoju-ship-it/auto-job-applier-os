name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: applyon
          POSTGRES_PASSWORD: applyon_secret
          POSTGRES_DB: applyon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U applyon -d applyon"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://applyon:applyon_secret@localhost:5432/applyon
      DIRECT_DATABASE_URL: postgresql://applyon:applyon_secret@localhost:5432/applyon
      REDIS_URL: redis://localhost:6379/0
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.21"
          enable-cache: true
          python-version: "3.12"  # same as production (infra/Dockerfile)
      - name: Install dependencies (with dev tools)
        run: uv sync --frozen --extra dev
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Type check (mypy)
        run: uv run mypy packages apps
      - name: Migrate and seed
        run: |
          uv run alembic upgrade head
          uv run python -m packages.core.seed.load_companies
      - name: Install Chromium (browser tests)
        run: uv run playwright install --with-deps chromium
      - name: Tests
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit -p .
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid
