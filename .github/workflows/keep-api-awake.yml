# Render's free web service sleeps after 15 minutes without traffic and then takes a minute or
# more to wake, which makes sign-in and every page look broken. A ping every 10 minutes keeps it
# warm. One always-on free service stays within Render's 750 free instance hours a month.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health/live
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 https://applyon-api.onrender.com/health/live || true)
            echo "attempt $attempt: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::warning::API did not answer /health/live"
