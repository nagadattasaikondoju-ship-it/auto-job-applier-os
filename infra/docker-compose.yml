version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: applyon-postgres
    restart: always
    environment:
      POSTGRES_USER: applyon
      POSTGRES_PASSWORD: applyon_secret
      POSTGRES_DB: applyon
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applyon -d applyon"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: applyon-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: applyon-api
    restart: always
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://applyon:applyon_secret@postgres:5432/applyon
      - DIRECT_DATABASE_URL=postgresql://applyon:applyon_secret@postgres:5432/applyon
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ../apps:/app/apps
      - ../packages:/app/packages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker_io:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: applyon-worker-io
    restart: always
    command: ["celery", "-A", "apps.workers.celery_app.celery_app", "worker", "--loglevel=info", "--queues=job_ingestion,embeddings,ai_matching,document_generation,notifications,autopilot,maintenance"]
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://applyon:applyon_secret@postgres:5432/applyon
      - DIRECT_DATABASE_URL=postgresql://applyon:applyon_secret@postgres:5432/applyon
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ../apps:/app/apps
      - ../packages:/app/packages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker_priority:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: applyon-worker-priority
    restart: always
    command: ["celery", "-A", "apps.workers.celery_app.celery_app", "worker", "--loglevel=info", "--queues=priority"]
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://applyon:applyon_secret@postgres:5432/applyon
      - DIRECT_DATABASE_URL=postgresql://applyon:applyon_secret@postgres:5432/applyon
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ../apps:/app/apps
      - ../packages:/app/packages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: applyon-beat
    restart: always
    command: ["celery", "-A", "apps.workers.celery_app.celery_app", "beat", "--loglevel=info"]
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://applyon:applyon_secret@postgres:5432/applyon
      - DIRECT_DATABASE_URL=postgresql://applyon:applyon_secret@postgres:5432/applyon
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ../apps:/app/apps
      - ../packages:/app/packages
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
