<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Applyon Copilot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fafafa;
      color: #18181b;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e4e4e7;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .logo {
      font-size: 18px;
      font-weight: 700;
      color: #4f46e5;
      letter-spacing: -0.5px;
    }
    .status-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 9999px;
      background: #ecfdf5;
      color: #059669;
    }
    .job-card {
      background: #ffffff;
      border: 1px solid #e4e4e7;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .job-title {
      font-size: 14px;
      font-weight: 600;
      color: #09090b;
      margin-bottom: 4px;
    }
    .company-name {
      font-size: 12px;
      color: #71717a;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 11px;
      color: #71717a;
    }
    .btn-primary {
      width: 100%;
      background: #4f46e5;
      color: #ffffff;
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s;
    }
    .btn-primary:hover {
      background: #4338ca;
    }
    .btn-secondary {
      width: 100%;
      background: transparent;
      color: #71717a;
      border: 1px solid #e4e4e7;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-secondary:hover {
      background: #f4f4f5;
    }
    .status-text {
      font-size: 12px;
      text-align: center;
      margin-top: 8px;
      color: #71717a;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">Applyon</div>
    <span class="status-badge" id="atsStatus">Detecting ATS...</span>
  </div>

  <div class="job-card">
    <div class="job-title" id="jobTitle">Job Page Detected</div>
    <div class="company-name" id="companyName">Ready for instant autofill</div>
    <div class="info-row">
      <span id="matchScore">Match: --</span>
      <span id="fieldsStatus">Pending analysis</span>
    </div>
  </div>

  <button class="btn-primary" id="autofillBtn">
    <span>✨ Autofill Application</span>
  </button>
  <button class="btn-secondary" id="dashboardBtn">
    Open Applyon Dashboard
  </button>

  <div class="status-text" id="statusMessage">Click autofill to populate answers</div>

  <script src="popup.js"></script>
</body>
</html>
